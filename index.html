<style>
  :root{
    --bg:#0f1720; --bg2:#16212e; --card:#1b2735; --card2:#22303f;
    --line:#2c3b4d; --text:#eef3f8; --muted:#9fb0c2; --accent:#00aeef;
    --accent2:#ec008c; --good:#39d98a; --warn:#ffd166; --radius:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:17px;line-height:1.4}
  body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  .app-header{position:sticky;top:0;z-index:10;
    background:linear-gradient(180deg,#0f1720,#0f1720f2);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
    padding:calc(env(safe-area-inset-top) + 10px) 14px 0}
  .header-inner{display:flex;align-items:center;gap:10px}
  .logo{display:flex;gap:3px;height:24px}
  .logo span{width:7px;border-radius:2px;display:block}
  .logo span:nth-child(1){background:#00aeef}
  .logo span:nth-child(2){background:#ec008c}
  .logo span:nth-child(3){background:#ffde17}
  .logo span:nth-child(4){background:#5b6b7d}
  h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.2px}
  .nav{display:flex;gap:8px;overflow-x:auto;padding:12px 0 10px;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav button{flex:0 0 auto;background:var(--card);color:var(--muted);
    border:1px solid var(--line);padding:9px 14px;border-radius:999px;
    font-size:15px;font-weight:600;white-space:nowrap;cursor:pointer}
  .nav button.active{background:var(--accent);color:#04141d;border-color:var(--accent)}
  .nav select{width:100%;background:var(--card);color:var(--text);
    border:1px solid var(--line);border-radius:12px;padding:13px 14px;
    font-size:17px;font-weight:700;-webkit-appearance:none;appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 12 12'><path d='M2 4l4 4 4-4' stroke='%2300aeef' stroke-width='1.8' fill='none' stroke-linecap='round'/></svg>");
    background-repeat:no-repeat;background-position:right 14px center;padding-right:36px}

  .app{max-width:680px;margin:0 auto;padding:16px 14px 8px}

    border:1px solid var(--line);border-radius:12px;padding:10px 12px}

    font-size:13px;text-align:center}

  @media (max-width:380px){.grid2{grid-template-columns:1fr}}

<body>
<header class="app-header">
  <div class="header-inner">
    <div class="logo" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
    <h1>Flexo Calculator</h1>
  </div>
  <nav id="nav" class="nav" aria-label="Calculators"></nav>
</header>

<main id="app" class="app"></main>

<footer class="app-footer">
  <p>Self-contained · Works offline · No internet needed</p>
  <p class="install-hint">Tip: in Safari tap <strong>Share → Add to Home Screen</strong> for an app icon</p>
</footer>

<script>
/* ---------- unit system (everything converts to a base unit) ---------- */
const UNITS = {
  length: { base:"in", list:[["in",1],["count",10],["mil",0.001],["ft",12]] }, // 1 count = 10 in
  speed:  { base:"ft/min", list:[["ft/min",1],["in/min",1/12]] },
  vol:    { base:"BCM", list:[["BCM",1],["cm³/m²",1/1.55]] } // 1 BCM/in² = 1.55 cm³/m²
};

const fmt = (n, p=3) => {
  if (!isFinite(n)) return "–";
  const a = Math.abs(n);
  if (a !== 0 && (a < 0.001 || a >= 1e7)) return n.toExponential(2);
  let s = n.toFixed(p);
  if (s.includes(".")) s = s.replace(/\.?0+$/,"");
  return Number(s).toLocaleString(undefined,{maximumFractionDigits:p});
};
const PI = Math.PI;

/* ---------- calculator definitions ---------- */
const CALCS = [
{
  id:"repeat", name:"Repeat", title:"Repeat & Cylinder",
  intro:"Print repeat and cylinder size from gear teeth, or work backwards to find the gear.",
  fields:[
    {id:"teeth", label:"Gear teeth", kind:"num", def:96},
    {id:"pitch", label:"Gear pitch", kind:"len", def:0.125, unit:"in",
      hint:"1/8\" = 0.125 in (most common)"},
    {id:"target", label:"Target repeat (optional → finds teeth)", kind:"len", def:"", unit:"in", optional:true}
  ],
  compute(v){
    const out=[];
    const repeat = v.teeth * v.pitch;           // in
    out.push({l:"Repeat length", v:fmt(repeat,3), u:"in", primary:true});
    out.push({l:"Repeat length", v:fmt(repeat/10,4), u:"count"});
    out.push({l:"Cylinder print circumference", v:fmt(repeat,3), u:"in"});
    out.push({l:"Print diameter (≈)", v:fmt(repeat/PI,3), u:"in"});
    if (v.target && v.pitch>0){
      const exact = v.target / v.pitch;
      const teeth = Math.round(exact);
      const got = teeth * v.pitch;
      out.push({l:"— Reverse —", v:""});
      out.push({l:"Nearest whole teeth", v:teeth, u:"teeth", primary:true});
      out.push({l:"Achievable repeat", v:fmt(got,3)+" in  ·  "+fmt(got/10,4)+" count"});
      out.push({l:"Difference vs target", v:fmt(got - v.target,4), u:"in"});
    }
    return out;
  },
  formula:"Repeat = teeth × pitch. Diameter ≈ repeat ÷ π. 1 count = 10 in."
},
{
  id:"anilox", name:"Anilox", title:"Anilox & Ink Mileage",
  intro:"Anilox volume and estimated ink coverage / consumption, in US units.",
  fields:[
    {id:"vol", label:"Anilox volume", kind:"vol", def:4, unit:"BCM"},
    {id:"cov", label:"Image area coverage", kind:"num", def:100, suf:"%"},
    {id:"te", label:"Transfer efficiency", kind:"num", def:100, suf:"%", hint:"typ. 30–60% in practice"},
    {id:"dens", label:"Ink density", kind:"num", def:1.0, suf:"g/cm³"},
    {id:"width", label:"Web width (optional)", kind:"len", def:"", unit:"in", optional:true},
    {id:"length", label:"Run length (optional)", kind:"len", def:"", unit:"ft", optional:true}
  ],
  compute(v){
    const out=[];
    const laid = v.vol * 1.55 * (v.cov/100) * (v.te/100);   // cm³/m² deposited
    out.push({l:"Anilox volume", v:fmt(v.vol,3), u:"BCM"});
    let ft2gal=0;
    if (laid>0){
      ft2gal = 40.746 * 1000 / laid;               // m²/L → ft²/gal
      out.push({l:"Ink mileage", v:fmt(ft2gal,0), u:"ft²/gal", primary:true});
      out.push({l:"Ink mileage", v:fmt(ft2gal/(v.dens*8.3454),0), u:"ft²/lb"});
    }
    if (v.width && v.length && ft2gal>0){
      const areaFt2 = (v.width * v.length) / 144;   // width(in) × length(in) → ft²
      const gal = areaFt2 / ft2gal;
      out.push({l:"— Job total —", v:""});
      out.push({l:"Printed area", v:fmt(areaFt2,0), u:"ft²"});
      out.push({l:"Ink required", v:fmt(gal,3)+" gal  ·  "+fmt(gal*v.dens*8.3454,2)+" lb", primary:true});
    }
    return out;
  },
  formula:"1 BCM/in² = 1.55 cm³/m². Mileage(ft²/gal) = 40.75 × 1000 ÷ (BCM×1.55×coverage×transfer). lb/gal = density × 8.345."
},
{
  id:"msi", name:"Roll MSI", title:"Roll MSI & Cost",
  intro:"Square inches (MSI = 1,000 in²) and cost for a roll or a group of rolls.",
  fields:[
    {id:"width", label:"Width", kind:"len", def:5.0, unit:"in"},
    {id:"length", label:"Length", kind:"len", def:5000, unit:"ft"},
    {id:"rate", label:"Price", kind:"num", def:0.50, suf:"$/MSI"},
    {id:"rolls", label:"Number of rolls", kind:"num", def:1}
  ],
  compute(v){
    const lenIn = v.length;                       // base is inches
    const msi = (v.width * lenIn) / 1000;         // MSI per roll
    const costRoll = msi * v.rate;
    const rolls = v.rolls || 0;
    return [
      {l:"MSI per roll", v:fmt(msi,2), u:"MSI", primary:true},
      {l:"Cost per roll", v:"$"+fmt(costRoll,2)},
      {l:"Area per roll", v:fmt(v.width*lenIn,0)+" in²  ·  "+fmt(v.width*lenIn/144,1)+" ft²"},
      {l:"— "+fmt(rolls,0)+" roll(s) —", v:""},
      {l:"Total MSI", v:fmt(msi*rolls,2), u:"MSI"},
      {l:"Total cost", v:"$"+fmt(costRoll*rolls,2), primary:true}
    ];
  },
  formula:"Area = width(in) × length(in). MSI = area ÷ 1,000. Cost = MSI × $/MSI. (1 ft = 12 in)"
},
{
  id:"speed", name:"Production", title:"Production & Speed",
  intro:"Impression rate and run time from press speed and repeat.",
  fields:[
    {id:"speed", label:"Press speed", kind:"speed", def:500, unit:"ft/min"},
    {id:"repeat", label:"Repeat length", kind:"len", def:20, unit:"in"},
    {id:"run", label:"Run length (optional)", kind:"len", def:"", unit:"ft", optional:true},
    {id:"imp", label:"Impressions needed (optional)", kind:"num", def:"", optional:true}
  ],
  compute(v){
    const out=[];
    const repFt = v.repeat/12;                       // ft (repeat input is inches)
    const ipm = repFt>0 ? v.speed/repFt : NaN;       // impressions/min (speed in ft/min)
    out.push({l:"Impressions / min", v:fmt(ipm,0), primary:true});
    out.push({l:"Impressions / hour", v:fmt(ipm*60,0)});
    out.push({l:"Linear output", v:fmt(v.speed*60,0), u:"ft/hr"});
    if (v.run){                                       // run input is inches (base)
      const runFt = v.run/12;
      out.push({l:"— Run length "+fmt(runFt,0)+" ft —", v:""});
      out.push({l:"Run time", v:fmtTime(runFt / v.speed)});
      out.push({l:"Impressions", v:fmt(runFt/repFt,0)});
    }
    if (v.imp){
      const lenFt = v.imp * repFt;
      out.push({l:"— "+fmt(v.imp,0)+" impressions —", v:""});
      out.push({l:"Material length", v:fmt(lenFt,1)+" ft  ·  "+fmt(lenFt*12,0)+" in"});
      out.push({l:"Run time", v:fmtTime(lenFt / v.speed)});
    }
    return out;
  },
  formula:"Impressions/min = speed ÷ repeat. Time = length ÷ speed."
},
{
  id:"convert", name:"Convert", title:"Length Converter",
  intro:"Quick conversions for repeats, plate calipers and tape.",
  fields:[
    {id:"val", label:"Value", kind:"len", def:1, unit:"in"}
  ],
  compute(v){
    const inch=v.val;                                // base is inches
    return [
      {l:"inches", v:fmt(inch,4)},
      {l:"count (10 in)", v:fmt(inch/10,5)},
      {l:"mil (0.001\")", v:fmt(inch/0.001,2)},
      {l:"feet", v:fmt(inch/12,5)}
    ];
  },
  formula:"1 count = 10 in · 1 ft = 12 in · 1 mil = 0.001 in."
}
];

function fmtTime(min){
  if (!isFinite(min)) return "–";
  if (min < 60) return fmt(min,1)+" min";
  const h=Math.floor(min/60), m=Math.round(min-h*60);
  return h+" h "+m+" min";
}

/* ---------- rendering ---------- */
const navEl = document.getElementById("nav");
const appEl = document.getElementById("app");
let active = location.hash.replace("#","") || CALCS[0].id;
if (!CALCS.some(c=>c.id===active)) active = CALCS[0].id;

function unitSelect(f){
  const grp = f.kind==="len"?"length":f.kind==="speed"?"speed":f.kind==="vol"?"vol":null;
  if(!grp) return "";
  const opts = UNITS[grp].list.map(([u])=>
    `<option ${u===f.unit?"selected":""}>${u}</option>`).join("");
  return `<select data-unit="${f.id}">${opts}</select>`;
}
function suffix(f){
  return f.suf ? `<span style="align-self:center;color:var(--muted);font-weight:600">${f.suf}</span>` : "";
}

function render(){
  navEl.innerHTML = `<select id="navSelect" aria-label="Choose calculator">`+
    CALCS.map(c=>`<option value="${c.id}" ${c.id===active?"selected":""}>${c.title}</option>`).join("")+
    `</select>`;
  const c = CALCS.find(x=>x.id===active);
  appEl.innerHTML = `<section class="card">
    <h2>${c.title}</h2><p class="intro">${c.intro}</p>
    ${c.fields.map(f=>{
      const ph = f.optional?'placeholder="optional"':'';
      const step = 'step="any"';
      return `<div class="field">
        <label for="f_${f.id}">${f.label}${f.hint?` <span style="color:#7e90a3;font-weight:500">· ${f.hint}</span>`:""}</label>
        <div class="control">
          <input id="f_${f.id}" type="number" inputmode="decimal" ${step} ${ph}
            data-f="${f.id}" value="${f.def}" />
          ${unitSelect(f)}${suffix(f)}
        </div></div>`;
    }).join("")}
    <div class="results" id="results"></div>
    <div class="formula">📐 ${c.formula}</div>
  </section>`;
  appEl.querySelectorAll("input,select").forEach(el=>{
    el.addEventListener("input",()=>{compute();save();});
  });
  compute();
}

function readValues(c){
  const v={};
  c.fields.forEach(f=>{
    const inp=document.querySelector(`[data-f="${f.id}"]`);
    let n = inp.value==="" ? "" : parseFloat(inp.value);
    if (n!=="" && isFinite(n)){
      const grp = f.kind==="len"?"length":f.kind==="speed"?"speed":f.kind==="vol"?"vol":null;
      if (grp){
        const sel=document.querySelector(`[data-unit="${f.id}"]`);
        const factor=(UNITS[grp].list.find(([u])=>u===sel.value)||[null,1])[1];
        n = n*factor; // to base unit
      }
    } else { n = f.optional ? "" : 0; }
    v[f.id]=n;
  });
  return v;
}

function compute(){
  const c=CALCS.find(x=>x.id===active);
  const v=readValues(c);
  const rows=c.compute(v);
  document.getElementById("results").innerHTML = rows.map(r=>{
    if(r.v==="") return `<div class="res-row" style="border:none;padding-bottom:0"><span class="rl" style="font-weight:700;color:var(--accent2)">${r.l}</span></div>`;
    return `<div class="res-row ${r.primary?"primary":""}">
      <span class="rl">${r.l}</span>
      <span class="rv">${r.v}${r.u?`<small>${r.u}</small>`:""}</span></div>`;
  }).join("");
}

function save(){
  const c=CALCS.find(x=>x.id===active); const d={};
  c.fields.forEach(f=>{
    const inp=document.querySelector(`[data-f="${f.id}"]`); d[f.id]=inp.value;
    const sel=document.querySelector(`[data-unit="${f.id}"]`); if(sel)d[f.id+"_u"]=sel.value;
  });
  try{localStorage.setItem("flexo_in_"+c.id,JSON.stringify(d));}catch(e){}
}
function load(){
  const c=CALCS.find(x=>x.id===active);
  try{
    const d=JSON.parse(localStorage.getItem("flexo_in_"+c.id)||"{}");
    Object.keys(d).forEach(k=>{
      if(k.endsWith("_u")){const s=document.querySelector(`[data-unit="${k.slice(0,-2)}"]`);if(s)s.value=d[k];}
      else{const i=document.querySelector(`[data-f="${k}"]`);if(i)i.value=d[k];}
    });
  }catch(e){}
}

navEl.addEventListener("change",e=>{
  if(e.target.id!=="navSelect")return;
  active=e.target.value; location.hash=active; render(); load(); compute();
});

render(); load(); compute();

/* offline support when hosted */
if ("serviceWorker" in navigator) {
  let reloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (reloaded) return; reloaded = true; window.location.reload();
  });
  window.addEventListener("load", () =>
    navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
</body>
</html>
